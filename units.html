<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CSS Units</title><link rel="stylesheet" href="style.css"></head><body><div class="reference-page"><h1>CSS Units</h1><table>
<tr><th>Unit</th><th>Description</th></tr>
<tr><td>px</td><td>Pixels.</td></tr>
<tr><td>%</td><td>Percentage.</td></tr>
<tr><td>em</td><td>Relative to element font size.</td></tr>
<tr><td>rem</td><td>Relative to root font size.</td></tr>
<tr><td>vw</td><td>1% of viewport width.</td></tr>
<tr><td>vh</td><td>1% of viewport height.</td></tr>
</table></div></body></html>
