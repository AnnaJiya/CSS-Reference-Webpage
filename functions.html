<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CSS Functions Reference</title><link rel="stylesheet" href="style.css"></head><body><div class="reference-page"><h1>CSS Functions Reference</h1><table>
<tr><th>Function</th><th>Example</th><th>Description</th></tr>
<tr><td>rgb()</td><td>rgb(255,0,0)</td><td>Defines a color using RGB.</td></tr>
<tr><td>rgba()</td><td>rgba(0,0,0,.5)</td><td>Defines color with transparency.</td></tr>
<tr><td>calc()</td><td>calc(100% - 20px)</td><td>Performs calculations.</td></tr>
<tr><td>min()</td><td>min(90%,800px)</td><td>Chooses the smaller value.</td></tr>
<tr><td>max()</td><td>max(50%,500px)</td><td>Chooses the larger value.</td></tr>
</table></div></body></html>
