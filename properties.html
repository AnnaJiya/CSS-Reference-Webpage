<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CSS Properties Reference</title><link rel="stylesheet" href="style.css"></head><body><div class="reference-page"><h1>CSS Properties Reference</h1><table>
<tr><th>Property</th><th>Description</th></tr>
<tr><td>color</td><td>Sets the text color.</td></tr>
<tr><td>background-color</td><td>Sets the background color.</td></tr>
<tr><td>font-size</td><td>Sets the size of text.</td></tr>
<tr><td>margin</td><td>Sets outer spacing.</td></tr>
<tr><td>padding</td><td>Sets inner spacing.</td></tr>
<tr><td>border</td><td>Defines an element border.</td></tr>
<tr><td>width</td><td>Sets width.</td></tr>
<tr><td>height</td><td>Sets height.</td></tr>
</table></div></body></html>
