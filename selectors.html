<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CSS Selectors Reference</title><link rel="stylesheet" href="style.css"></head><body><div class="reference-page"><h1>CSS Selectors Reference</h1><table>
<tr><th>Selector</th><th>Example</th><th>Description</th></tr>
<tr><td>Element</td><td>p { }</td><td>Selects all matching elements.</td></tr>
<tr><td>Class</td><td>.box { }</td><td>Selects elements with a class.</td></tr>
<tr><td>ID</td><td>#header { }</td><td>Selects the element with an ID.</td></tr>
<tr><td>Universal</td><td>* { }</td><td>Selects all elements.</td></tr>
<tr><td>Grouping</td><td>h1, h2 { }</td><td>Selects multiple elements.</td></tr>
</table></div></body></html>
